# Production-Ready Nginx Security Headers
# Include in your server {} block or as a separate include file

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection
add_header X-Frame-Options "DENY" always;

# XSS filter (legacy browsers, harmless on modern)
add_header X-XSS-Protection "1; mode=block" always;

# Strict Transport Security — 1 year + subdomains + preload eligible
# Only enable if you're certain HTTPS works everywhere (including subdomains)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy — restrictive by default, adjust for your app
# This example allows: same-origin scripts/styles/images, Google Fonts, inline styles (if needed)
add_header Content-Security-Policy "
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://apis.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  img-src 'self' data: https:;
  font-src 'self' https://fonts.gstatic.com;
  connect-src 'self' https://api.yourdomain.com wss://yourdomain.com;
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
  object-src 'none';
  upgrade-insecure-requests;
" always;

# Referrer Policy — limit referrer information
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (formerly Feature Policy) — disable powerful APIs by default
add_header Permissions-Policy "
  accelerometer=(),
  camera=(),
  geolocation=(),
  gyroscope=(),
  magnetometer=(),
  microphone=(),
  payment=(),
  usb=(),
  interest-cohort=()
" always;

# Remove server version disclosure
server_tokens off;

# Optional: Expect-CT for Certificate Transparency (requires valid CT logs)
# add_header Expect-CT "max-age=86400, enforce, report-uri=https://yourdomain.com/ct-report" always;

# Optional: Cross-Origin policies for isolation (adjust for your embedding needs)
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;
# add_header Cross-Origin-Embedder-Policy "require-corp" always;