    <!--
      SokoMtaani · direction contract
      THESIS: A phone-first till and stock system for a Kenyan retail shop that makes selling,
      margin, and stock truth immediate — the familiar SaaS dashboard canon (ShopZen/Linear
      reference, user-pinned) executed at full fidelity, refusing dashboard slop: no purple,
      no icon-card nesting, no eyebrow labels, no ghost cards.
      OWN-WORLD: warm light surfaces (canvas #f3f4f0, white content), a deep market-green
      accent (primary actions, current selection, one drenched stat moment), warm ink neutrals,
      Inter for all type with IBM Plex Mono reserved for batch/sale IDs and tabular figures.
      Status pills carry meaning: green = open/synced, amber = pending, red = low stock/closed.
      STORY: the owner opens the day and sees profit, margin, and stock risk at a glance; an
      attendant opens the till and completes a sale with a thumb in under a minute, even offline.
      FIRST VIEWPORT: desktop dashboard — breadcrumbed page header with one primary action, a
      drenched daily-profit panel, quiet stat tiles, profit chart, and alert lists; phone POS —
      a full-height grid of tappable product tiles, cart and total docked at the bottom, PIN pad
      before any charge.
      FORM: canon — modern SaaS dashboard reference (ShopZen/Linear), user-pinned, no concept
      seed required; executed at the reference's craft level.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md.
    -->
